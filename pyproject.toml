[project]
name = "forgemind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.24.0",
    "pydantic==2.10.3",
    "pytest>=8.3.4",
    "python-multipart>=0.0.20",
    "uvicorn>=0.46.0",
]

[project.scripts]
forgemind = "forgemind.cli:main"
forgemind-model-smoke = "forgemind.agent.model_smoke:main"
forgemind-web = "forgemind.web.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
# 将 pytest 临时文件限制在项目目录，避免 Windows 用户级临时目录的 ACL 冲突。
addopts = "--basetemp=.test-tmp"

[tool.setuptools.packages.find]
where = ["backend"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
