[project]
name = "forgemind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
# Windows 上部分 Python/IDE 无权访问用户级 pytest 临时目录。
# IDE 使用独立目录，避免与 Codex 沙箱创建的受限临时目录争用 ACL。
addopts = "--basetemp=.test-tmp/pytest-user"

[tool.setuptools.packages.find]
where = ["backend"]
