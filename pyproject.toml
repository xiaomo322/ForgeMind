[project]
name = "forgemind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
# Windows 上部分 Python/IDE 无权访问用户级 pytest 临时目录。
# 统一使用已被 Git 忽略的项目内目录，也让 tmp_path 行为在 IDE 和命令行一致。
addopts = "--basetemp=.test-tmp/pytest"

[tool.setuptools.packages.find]
where = ["backend"]
