[project]
name = "forgemind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]
